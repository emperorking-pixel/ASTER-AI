Run this, which fetches current compatible versions automatically:
#
#   flutter pub add http flutter_secure_storage speech_to_text flutter_tts \
#     flutter_background_service flutter_background_service_android \
#     flutter_local_notifications notification_listener_service path_provider
#
# That command edits pubspec.yaml for you. The dependencies block will end up
# looking roughly like this (exact version numbers will be newer by the time
# you run it -- that's expected and fine):

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.2.0
  flutter_local_notifications: ^18.0.0
  notification_listener_service: ^0.3.5
  path_provider: ^2.1.4
